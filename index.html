<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THANATOS WARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --panel: rgba(14,16,22,.82);
      --border: rgba(90,180,255,.38);
      --hot: rgba(140,210,255,.85);
      --trauma: #ff3b4e;
      --stab: #2ee6ff;
      --life: #e8d5a3;
      --text: #d7e8ff;
      --muted: #7a93b0;
      --mx: #2ee67a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; color: var(--text); font-family: Orbitron, sans-serif; user-select: none; }
    button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }

    .world { position: fixed; inset: 0; background:
      radial-gradient(ellipse at 28% 18%, rgba(60,20,30,.28), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(20,40,80,.28), transparent 45%), #05070c; }
    .scan { pointer-events: none; position: fixed; inset: 0; z-index: 40; background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,.07) 3px); }

    .panel { background: var(--panel); border: 1px solid var(--border); box-shadow: 0 0 14px rgba(70,160,255,.22); backdrop-filter: blur(10px); transition: 160ms ease; }
    .panel:hover, .panel:focus-within { border-color: var(--hot); }

    .hud { position: fixed; top: 14px; left: 14px; z-index: 30; width: 260px; padding: 10px 12px; }
    .hud-h { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 6px; color: #5ab4ff; }
    .hud-h b { font-weight: 400; color: var(--muted); font-family: "Share Tech Mono", monospace; }
    .meta { display: flex; justify-content: space-between; font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 6px 0 3px; }
    .val { font-family: "Share Tech Mono", monospace; color: var(--text); }
    .track { height: 8px; background: #0007; border: 1px solid #fff1; overflow: hidden; }
    .fill { height: 100%; width: 0; transition: width .3s; }
    .fill.t { background: linear-gradient(90deg, #6a1018, var(--trauma)); box-shadow: 0 0 8px #ff3b4e99; }
    .fill.s { background: linear-gradient(90deg, #0a5a6e, var(--stab)); }
    .fill.l { background: linear-gradient(90deg, #6a5420, var(--life)); }
    .hud.warn { border-color: #ff3b4e99; animation: pr 1.2s ease-in-out infinite; }
    @keyframes pr { 50% { box-shadow: 0 0 22px #ff3b4e88; } }

    .radar { position: fixed; top: 14px; right: 14px; z-index: 30; width: 120px; height: 120px; padding: 6px; border-radius: 50%; }
    .radar .disk { width: 100%; height: 100%; border-radius: 50%; border: 1px solid var(--border); position: relative; overflow: hidden; background: radial-gradient(circle, #14283c66, #04080e); }
    .sweep { position: absolute; inset: 0; background: conic-gradient(from 0deg, transparent, #ff506644 40deg, transparent 70deg); animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blip { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--stab); box-shadow: 0 0 6px var(--stab); }
    .blip.you { left: 50%; top: 50%; transform: translate(-50%,-50%); background: #fff; }
    .blip.dead { background: var(--trauma); box-shadow: 0 0 6px var(--trauma); }

    .dock { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 6px; }
    .slot { width: 54px; height: 76px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: linear-gradient(#121822,#080a10); border: 1px solid #5ab4ff55; color: var(--muted); font-size: 7px; letter-spacing: .12em; text-transform: uppercase; border-radius: 5px 5px 7px 7px; }
    .slot .g { font-size: 16px; margin-top: 8px; }
    .slot:hover, .slot.active { color: #fff; border-color: var(--hot); transform: translateY(-5px); }

    .screen { position: fixed; inset: 0; z-index: 10; display: none; padding: 88px 16px 104px; overflow: auto; }
    .screen.on { display: block; }
    .inner { max-width: 640px; margin: 0 auto; }

    #screen-boot { text-align: center; padding-top: 22vh; }
    .logo { font-size: clamp(22px, 6vw, 36px); letter-spacing: .24em; }
    .logo em { font-style: normal; color: var(--trauma); }
    .cta { margin-top: 28px; padding: 12px 22px; border: 1px solid var(--border); letter-spacing: .2em; text-transform: uppercase; font-size: 11px; }

    .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .pip { padding: 6px 8px; font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }
    .channels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .ch { padding: 12px 8px; min-height: 88px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
    .ch.hot { border-color: #ff3b4e88; box-shadow: 0 0 12px #ff3b4e44; }
    .ch.dead { opacity: .35; filter: grayscale(1); }
    .ch .n { font-size: 8px; letter-spacing: .2em; color: var(--muted); }
    .floor { display: flex; gap: 8px; margin-top: 12px; }
    .floor .mini { flex: 1; padding: 14px 8px; font-size: 10px; }
    .mini { flex: 1; padding: 6px 2px; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid #5ab4ff44; color: var(--muted); border-radius: 4px; }
    .mini:hover { color: #fff; border-color: var(--hot); }
    .mini.danger { border-color: #ff3b4e66; color: #ff8a96; }

    .mxbox { position: relative; min-height: 440px; border: 1px solid #2ee67a44; background: #020604; overflow: hidden; }
    #matrix { position: absolute; inset: 0; width: 100%; height: 100%; }
    .decrypt { position: relative; z-index: 2; min-height: 440px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .line { font-family: "Share Tech Mono", monospace; font-size: 13px; color: #9fffc8; text-shadow: 0 0 8px #50ffa066; min-height: 1.3em; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .chip { padding: 8px 10px; border: 1px solid #50ffa059; color: #9fffc8; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; background: #00140888; }
    .chip:hover, .chip.on { color: #fff; box-shadow: 0 0 10px #50ffa055; }

    .incoming { display: flex; justify-content: center; gap: 8px; min-height: 150px; margin: 8px 0; }
    .card { position: relative; padding: 8px; text-align: left; border-radius: 4px 4px 8px 8px; }
    .card.trauma { width: 118px; height: 150px; border: 1px solid #ff3b4e88; background: linear-gradient(#380a0ed9, #100408); box-shadow: 0 5px 0 #40000066; }
    .card.trauma.live { outline: 1px solid #ffd18a; transform: translateY(-4px); }
    .card .k { font-size: 7px; letter-spacing: .16em; text-transform: uppercase; color: var(--trauma); margin-bottom: 4px; }
    .card .b { font-family: "Share Tech Mono", monospace; font-size: 10px; line-height: 1.35; }
    .amp { position: absolute; top: 6px; right: 6px; color: var(--trauma); font-size: 8px; }
    .jack { display: flex; justify-content: center; align-items: flex-end; height: 180px; }
    .card.treat { width: 92px; height: 164px; margin: 0 -8px; border: 1px solid #2ee6ff66; background: linear-gradient(#122834, #060a10); box-shadow: 0 8px 0 #0007; padding: 10px 7px; transform-origin: bottom center; }
    .card.treat:nth-child(1) { transform: rotate(-12deg) translateY(12px); }
    .card.treat:nth-child(2) { transform: rotate(-6deg) translateY(5px); }
    .card.treat:nth-child(3) { transform: rotate(0); z-index: 5; }
    .card.treat:nth-child(4) { transform: rotate(6deg) translateY(5px); }
    .card.treat:nth-child(5) { transform: rotate(12deg) translateY(12px); }
    .card.treat:hover { transform: translateY(-14px) rotate(0) scale(1.05); z-index: 8; border-color: #ffe08a; }
    .card.treat .k { color: var(--stab); }
    .card.treat strong { display: block; font-size: 9px; margin-bottom: 4px; color: #fff; }
    .log { max-height: 72px; overflow: auto; padding: 8px; font-family: "Share Tech Mono", monospace; font-size: 11px; color: #b7c8dc; margin-top: 8px; }
    .log .bad { color: #ff8a96; } .log .good { color: #8af0ff; }

    .toast { position: fixed; top: 78px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 8px 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    .types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tc { padding: 10px; }
    .tc h3 { font-size: 11px; margin-bottom: 4px; }
    .tc p { font-family: "Share Tech Mono", monospace; font-size: 11px; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body>
  <div class="world"></div>
  <div class="scan"></div>

  <section class="panel hud" id="hud">
    <div class="hud-h">Clinician <b>WARD-θ</b></div>
    <div class="meta"><span>Trauma</span><span class="val" id="tr">00%</span></div>
    <div class="track"><div class="fill t" id="tf"></div></div>
    <div class="meta"><span>Stabilizers</span><span class="val" id="sr">100%</span></div>
    <div class="track"><div class="fill s" id="sf"></div></div>
  </section>

  <section class="panel radar">
    <div class="disk" id="disk">
      <div class="sweep"></div>
      <span class="blip you"></span>
    </div>
  </section>

  <nav class="dock">
    <button class="slot" data-go="ward"><span class="g">▣</span>Ward</button>
    <button class="slot" data-go="dossier" id="bd" disabled><span class="g">◎</span>Psyche</button>
    <button class="slot" data-go="atlas"><span class="g">▦</span>Atlas</button>
    <button class="slot" data-go="session" id="bs" disabled><span class="g">⌬</span>Sit</button>
  </nav>

  <div class="toast panel" id="toast"></div>

  <section class="screen on" id="screen-boot">
    <div class="inner">
      <div class="logo">THANATOS <em>WARD</em></div>
      <button class="cta panel" id="enter">Enter</button>
    </div>
  </section>

  <section class="screen" id="screen-ward">
    <div class="inner">
      <div class="bar">
        <span class="pip panel" id="onl">0 LIVE</span>
        <span class="pip panel" id="sel">0 SEALED</span>
        <span class="pip panel" id="att">FIELD OFF</span>
      </div>
      <div class="channels" id="channels"></div>
      <div class="floor">
        <button class="mini panel" id="hold-all">Hold field</button>
        <button class="mini panel" id="feed-sit">Feed sit</button>
        <button class="mini panel" id="nshift" style="display:none">New shift</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-dossier">
    <div class="inner" id="psy"></div>
  </section>

  <section class="screen" id="screen-atlas">
    <div class="inner">
      <div class="types" id="atlas"></div>
    </div>
  </section>

  <section class="screen" id="screen-session">
    <div class="inner">
      <div class="meta"><span id="sl">Sit</span><span class="val" id="ll">—</span></div>
      <div class="track"><div class="fill l" id="lf"></div></div>
      <div class="incoming" id="in"></div>
      <div class="jack" id="hand"></div>
      <div class="panel log" id="log"></div>
    </div>
  </section>

<script>
const JUNG = [
  { id:"Te", name:"Extraverted Thinking", shadow:"Fi grief", blurb:"Orders the outer measure." },
  { id:"Ti", name:"Introverted Thinking", shadow:"Fe weather", blurb:"Private architectures." },
  { id:"Fe", name:"Extraverted Feeling", shadow:"Ti equation", blurb:"Tunes the chorus." },
  { id:"Fi", name:"Introverted Feeling", shadow:"Te tally", blurb:"Sealed chapel of values." },
  { id:"Se", name:"Extraverted Sensation", shadow:"Ni omen", blurb:"Lives in the fact of now." },
  { id:"Si", name:"Introverted Sensation", shadow:"Ne futures", blurb:"Archives exact texture." },
  { id:"Ne", name:"Extraverted Intuition", shadow:"Si body-memory", blurb:"Forks in public air." },
  { id:"Ni", name:"Introverted Intuition", shadow:"Se raw now", blurb:"One inner image to the end." }
];

const TREAT = [
  { id:"suture", name:"Suture", kind:"Heal", match:[], heal:10, always:true, text:"Mend only." },
  { id:"integrate", name:"Shadow", kind:"Jung", match:["shadow"], heal:16, text:"Name the refuse." },
  { id:"interpret", name:"Interpret", kind:"Freud", match:["id","ego","superego"], heal:14, text:"Wish plus law." },
  { id:"contain", name:"Contain", kind:"Ego", match:["ego","anal"], heal:12, text:"Hold the flood." },
  { id:"catharsis", name:"Catharsis", kind:"Id", match:["id","oral"], heal:14, text:"Bounded drive." },
  { id:"persona", name:"Persona", kind:"Jung", match:["persona"], heal:10, text:"Loosen the mask." },
  { id:"anima", name:"Anima", kind:"Jung", match:["anima"], heal:14, text:"Inner other." },
  { id:"eros", name:"Eros", kind:"Drive", match:["eros"], heal:16, text:"Re-knit." },
  { id:"defense", name:"Defense", kind:"Freud", match:["defense","superego"], heal:12, text:"Name the guard." }
];

const DECK = [
  { text:"A door that was never opened says your name.", tags:["oral","shadow","id"], who:"elara" },
  { text:"The future arrives as a smell of metal.", tags:["shadow","persona"], who:"elara" },
  { text:"The metric was clean. The person was not counted.", tags:["shadow","id"], who:"kael" },
  { text:"Grief without a ticket number.", tags:["shadow","id"], who:"kael" },
  { text:"The vote has been called back.", tags:["persona","phallic"], who:"nyx" },
  { text:"A thought that would end the party grows teeth.", tags:["shadow","superego"], who:"nyx" },
  { text:"A childhood page is blank and spreading.", tags:["defense","oral"], who:"ion" },
  { text:"The old house is furnished. No one lives there.", tags:["thanatos"], who:"ion" },
  { text:"The room wants a mood. You offer a theorem.", tags:["shadow","persona"], who:"riven" },
  { text:"A feeling will not become a premise.", tags:["id","shadow"], who:"riven" },
  { text:"They scored you. The number was usable.", tags:["shadow","superego"], who:"mira" },
  { text:"A vow made alone is being auctioned.", tags:["eros"], who:"mira" },
  { text:"Nothing is happening. The omen has no fists.", tags:["shadow"], who:"jax" },
  { text:"Impact without object.", tags:["id","oral"], who:"jax" },
  { text:"One memory refuses to fork.", tags:["shadow","defense"], who:"sable" },
  { text:"Every door leads to the same plate.", tags:["anal"], who:"sable" },
  { text:"The watching parent clears a throat in the ribs.", tags:["superego","defense"], who:null },
  { text:"Hunger with no object.", tags:["id","oral"], who:null },
  { text:"A mask smiles. The Self steps back.", tags:["persona"], who:null },
  { text:"The inner other turns away.", tags:["anima","eros"], who:null }
];

function roster() {
  return [
    { id:"elara", name:"ELARA VOSS", unit:"07-A3", type:"Ni", persona:"Quiet Oracle", anima:"Judge in a father’s coat",
      shadow:"Se — the unendurable now", shadowText:"Present tense as rumor.",
      freud:{ id:22, ego:48, superego:86, stage:"Oral", defense:"Intellectualization" },
      life:88, colors:["#1a2a44","#6aa0c8"] },
    { id:"kael", name:"KAEL RADEK", unit:"11-F2", type:"Te", persona:"Efficient Blade", anima:"Drowned singer",
      shadow:"Fi — unofficial grief", shadowText:"A value never ratified.",
      freud:{ id:40, ego:62, superego:55, stage:"Anal", defense:"Isolation" },
      life:84, colors:["#2a1a14","#c88a4a"] },
    { id:"nyx", name:"NYX SOLANO", unit:"03-K9", type:"Fe", persona:"Warm Frequency", anima:"Glass thinker",
      shadow:"Ti — cold equation", shadowText:"A true thought that would empty the room.",
      freud:{ id:58, ego:40, superego:70, stage:"Oedipal", defense:"Reaction formation" },
      life:82, colors:["#2a1430","#d080b0"] },
    { id:"ion", name:"ION MARROW", unit:"19-Θ1", type:"Si", persona:"Archivist", anima:"A mutating file",
      shadow:"Ne — futures that refuse the archive", shadowText:"Possibility as contamination.",
      freud:{ id:35, ego:55, superego:50, stage:"Latency", defense:"Repression" },
      life:90, colors:["#102018","#6cb890"] },
    { id:"riven", name:"RIVEN QUILL", unit:"22-C4", type:"Ti", persona:"Closed Circuit", anima:"A laughing next room",
      shadow:"Fe — weather of the room", shadowText:"Mood that will not parse.",
      freud:{ id:30, ego:70, superego:48, stage:"Latency", defense:"Rationalization" },
      life:86, colors:["#121826","#7aa0d0"] },
    { id:"mira", name:"MIRA KEST", unit:"08-L7", type:"Fi", persona:"Private Chapel", anima:"Public clerk",
      shadow:"Te — crude tally", shadowText:"Being measured cuts deeper than being hurt.",
      freud:{ id:44, ego:42, superego:72, stage:"Genital", defense:"Against self" },
      life:80, colors:["#1c1428","#c9a0e0"] },
    { id:"jax", name:"JAX ORRIN", unit:"14-S0", type:"Se", persona:"Live Wire", anima:"A loud prophet",
      shadow:"Ni — unread omen", shadowText:"Meaning he cannot punch.",
      freud:{ id:68, ego:38, superego:28, stage:"Oral", defense:"Acting out" },
      life:79, colors:["#2a220c","#e0b050"] },
    { id:"sable", name:"SABLE WREN", unit:"05-N6", type:"Ne", persona:"Forking Mouth", anima:"One unedited memory",
      shadow:"Si — unedited body-memory", shadowText:"A scar that will not metaphorize.",
      freud:{ id:50, ego:46, superego:40, stage:"Anal", defense:"Displacement" },
      life:83, colors:["#0e2430","#5ad0c0"] }
  ].map((p) => Object.assign(p, { sealed:false, archived:false, alert:false }));
}

const S = {
  screen:"boot", P: roster(), sel:null, attend:null, field:false,
  trauma:0, stab:100, incoming:[], hand:[], tick:null, ward:null, mx:null
};

const $ = (id) => document.getElementById(id);
function toast(m){ const e=$("toast"); e.textContent=m; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),1400); }
function hud(){
  $("tf").style.width=S.trauma+"%"; $("tr").textContent=String(S.trauma).padStart(2,"0")+"%";
  $("sf").style.width=S.stab+"%"; $("sr").textContent=S.stab+"%";
  $("hud").classList.toggle("warn", S.trauma>=55);
}
function av(p){
  return `<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="${p.colors[0]}"/><circle cx="32" cy="26" r="12" fill="${p.colors[1]}"/><ellipse cx="32" cy="52" rx="18" ry="16" fill="${p.colors[1]}" opacity=".7"/></svg>`;
}

function go(name){
  if(name!=="dossier") stopMx();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("screen-"+name).classList.add("on");
  document.querySelectorAll(".dock .slot").forEach(b=>b.classList.toggle("active", b.dataset.go===name));
  S.screen=name;
  if(name==="ward") paintWard();
  if(name==="dossier") paintPsyche();
  if(name==="session") paintSession();
}

function paintRadar(){
  const disk=$("disk");
  disk.querySelectorAll(".blip:not(.you)").forEach(n=>n.remove());
  S.P.filter(p=>!p.archived).forEach((p,i)=>{
    const b=document.createElement("span");
    b.className="blip"+(p.sealed?" dead":"");
    b.style.left=(18+ (i*9)%64)+"%";
    b.style.top=(22+(i*13)%58)+"%";
    disk.appendChild(b);
  });
}

function liveList(){ return S.P.filter(p=>!p.sealed && !p.archived && p.life>0); }

function feed(){
  const live=liveList();
  if(!live.length){ toast("Floor empty"); go("ward"); return false; }
  let p=live[Math.floor(Math.random()*live.length)];
  if(S.sel && !S.sel.sealed && live.includes(S.sel)) p=S.sel;
  else if(S.sel && S.sel.sealed) p=live[Math.floor(Math.random()*live.length)];
  S.sel=p; S.incoming=[];
  $("bd").disabled=false; $("bs").disabled=false;
  return true;
}

function paintWard(){
  const live=liveList();
  const sealed=S.P.filter(p=>p.sealed && !p.archived);
  $("onl").textContent=live.length+" LIVE";
  $("sel").textContent=sealed.length+" SEALED";
  $("att").textContent=S.field?"FIELD ON":"FIELD OFF";
  $("nshift").style.display=live.length===0?"inline-block":"none";
  paintRadar();
  const chans=S.P.filter(p=>!p.archived);
  $("channels").innerHTML=chans.map((p,i)=>{
    const dead=p.sealed||p.life<=0;
    return `<div class="panel ch ${dead?"dead":""} ${p.alert?"hot":""}">
      <div class="n">CH ${String(i+1).padStart(2,"0")}</div>
      <div class="track"><div class="fill l" style="width:${dead?0:p.life}%"></div></div>
    </div>`;
  }).join("");
}

function holdField(){
  S.field=!S.field;
  S.stab=Math.max(0,S.stab-(S.field?10:0));
  S.P.forEach(p=>{ if(!p.sealed) p.alert=false; });
  hud(); toast(S.field?"Field on":"Field off"); paintWard();
}

function stopMx(){ if(S.mx){ cancelAnimationFrame(S.mx); S.mx=null; } }
function startMx(c){
  stopMx();
  const ctx=c.getContext("2d");
  const g="01アイウエオカキクケコサシスセソタチツテトナニヌネノΔΨΩθλΣﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ";
  let w,h,cols,drops;
  function sz(){ w=c.width=c.offsetWidth||640; h=c.height=c.offsetHeight||440; cols=Math.max(8,Math.floor(w/14)); drops=Array.from({length:cols},()=>Math.random()*-30); }
  sz();
  (function frame(){
    ctx.fillStyle="rgba(2,6,4,0.14)"; ctx.fillRect(0,0,w,h);
    ctx.font="13px monospace";
    for(let i=0;i<drops.length;i++){
      ctx.fillStyle=i%7===0?"#e8ffe8":"#2ee67a";
      ctx.fillText(g[Math.floor(Math.random()*g.length)], i*14, drops[i]*16);
      drops[i]+=0.7+Math.random()*0.35;
      if(drops[i]*16>h && Math.random()>0.975) drops[i]=-6;
    }
    S.mx=requestAnimationFrame(frame);
  })();
}

function paintPsyche(){
  if(!S.sel || S.sel.sealed){ if(!feed()) return; }
  const p=S.sel;
  if(!p || p.sealed){ go("ward"); return; }
  const j=JUNG.find(x=>x.id===p.type);
  const L={
    type: j.name+" · "+p.persona,
    shadow: p.shadow+" — "+p.shadowText,
    id: "Id "+p.freud.id+" · "+p.freud.stage,
    ego: "Ego "+p.freud.ego+" · "+p.freud.defense,
    superego: "Superego "+p.freud.superego,
    anima: p.anima
  };
  $("psy").innerHTML=`<div class="mxbox"><canvas id="matrix"></canvas>
    <div class="decrypt">
      <div class="line">${p.name}  ${p.unit}</div>
      <div class="line" id="mxo">_</div>
      <div class="chips">${Object.keys(L).map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join("")}
        <button class="chip" id="sit2">Sit</button></div>
    </div></div>`;
  startMx($("matrix"));
  $("psy").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ $("mxo").textContent=L[b.dataset.k]; b.classList.add("on"); });
  $("sit2").onclick=()=>go("session");
}

function deal(){
  const pool=TREAT.filter(t=>!t.always).sort(()=>Math.random()-.5);
  S.hand=[TREAT[0], ...pool.slice(0,4)].sort(()=>Math.random()-.5);
  $("hand").innerHTML=S.hand.map(t=>`<button class="panel card treat" data-id="${t.id}">
    <div class="k">${t.kind}</div><div class="b"><strong>${t.name}</strong>${t.text}</div></button>`).join("");
  $("hand").querySelectorAll(".treat").forEach(b=>b.onclick=()=>play(b.dataset.id));
}

function paintIn(){
  $("in").innerHTML=S.incoming.map((c,i)=>`<article class="panel card trauma ${i===0?"live":""}">
    <span class="amp">${"▲".repeat(c.amp||1)}</span>
    <div class="k">${i===0?"LIVE ×"+(c.amp||1):"WAIT"}</div>
    <div class="b">${c.text}</div></article>`).join("");
}

function paintLife(){
  if(!S.sel) return;
  $("sl").textContent=S.sel.name;
  $("ll").textContent=Math.round(S.sel.life)+"%";
  $("lf").style.width=S.sel.life+"%";
}

function log(h){ $("log").innerHTML=`<div>${h}</div>`+$("log").innerHTML; }

function drawTrauma(){
  const p=S.sel; if(!p||p.sealed) return;
  const pool=DECK.filter(c=>!c.who||c.who===p.id);
  const c=pool[Math.floor(Math.random()*pool.length)];
  const amp=1+Math.floor(Math.random()*2);
  S.incoming.push({...c, amp});
  S.incoming=S.incoming.slice(-3);
  S.trauma=Math.min(100,S.trauma+amp*4);
  p.life=Math.max(0,p.life-amp);
  hud(); paintIn(); paintLife();
  if(p.life<=0) seal(p);
}

function escalate(){
  const live=S.incoming[0]; if(!live||!S.sel) return;
  live.amp=Math.min(4,(live.amp||1)+1);
  S.sel.life=Math.max(0,S.sel.life-live.amp);
  S.trauma=Math.min(100,S.trauma+live.amp*2);
  paintIn();
}

function play(id){
  const p=S.sel; if(!p||p.sealed) return;
  const t=TREAT.find(x=>x.id===id);
  const live=S.incoming[0];
  S.stab=Math.max(0,S.stab-5);
  if(t.always){
    p.life=Math.min(100,p.life+(t.heal||8));
    S.trauma=Math.max(0,S.trauma-6);
    log(`<span class="good">${t.name}</span>`);
    hud(); paintLife(); return;
  }
  const hit=live && t.match.some(m=>live.tags.includes(m));
  if(hit){
    const amp=live.amp||1;
    S.incoming.shift();
    S.trauma=Math.max(0,S.trauma-(10+amp*4));
    p.life=Math.min(100,p.life+t.heal);
    log(`<span class="good">${t.name} ×${amp}</span>`);
    deal();
  } else {
    S.trauma=Math.min(100,S.trauma+8);
    p.life=Math.max(0,p.life-7);
    log(`<span class="bad">${t.name}</span>`);
  }
  hud(); paintIn(); paintLife();
  if(p.life<=0) seal(p);
}

function seal(p){
  p.life=0; p.sealed=true; p.alert=false;
  S.trauma=Math.min(100,S.trauma+18);
  if(S.sel && S.sel.id===p.id) S.sel=null;
  hud(); toast("Sealed");
  if(liveList().length){ feed(); paintSession(); }
  else go("ward");
}

function paintSession(){
  if(!S.sel || S.sel.sealed || S.sel.life<=0){
    if(!feed()) return;
  }
  if(S.tick) clearInterval(S.tick);
  S.incoming=[]; $("log").innerHTML="";
  deal(); paintIn(); paintLife();
  S.tick=setInterval(()=>{
    if(S.screen!=="session"||!S.sel||S.sel.sealed) return;
    S.sel.life=Math.max(0,S.sel.life-0.4);
    S.stab=Math.min(100,S.stab+2);
    if(S.incoming[0]) escalate();
    if(Math.random()<0.34) drawTrauma();
    paintLife(); hud();
    if(S.sel.life<=0) seal(S.sel);
  },4000);
}

function pulse(){
  if(S.ward) return;
  S.ward=setInterval(()=>{
    S.P.forEach(p=>{
      if(p.archived) return;
      if(p.life<=0){ p.sealed=true; return; }
      if(p.sealed) return;
      if(S.sel && S.sel.id===p.id && S.screen==="session") return;
      const hold=S.field;
      p.life=Math.max(0,p.life-(hold?0.08:0.24));
      if(Math.random()<0.16){ p.alert=true; p.life=Math.max(0,p.life-2); S.trauma=Math.min(100,S.trauma+3); }
      if(p.life<=0) p.sealed=true;
    });
    hud();
    if(S.screen==="ward") paintWard();
  },4000);
}

function newShift(){
  S.P=roster(); S.sel=null; S.attend=null; S.field=false; S.incoming=[]; S.trauma=0; S.stab=100;
  hud(); toast("New shift"); feed(); go("session");
}

$("atlas").innerHTML=JUNG.map(j=>`<article class="panel tc"><h3>${j.name}</h3><p>${j.blurb}<br>Shadow ${j.shadow}</p></article>`).join("");
hud();
$("enter").onclick=()=>{ pulse(); feed(); go("session"); };
$("nshift").onclick=newShift;
$("hold-all").onclick=holdField;
$("feed-sit").onclick=()=>{ S.sel=null; if(feed()) go("session"); };
document.querySelectorAll(".dock .slot").forEach(b=>b.onclick=()=>{
  if(b.disabled) return;
  if(b.dataset.go==="session"){ feed(); go("session"); return; }
  if(b.dataset.go==="dossier"){ feed(); go("dossier"); return; }
  go(b.dataset.go);
});
</script>
</body>
</html>
